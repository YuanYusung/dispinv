name: Validate joint Rayleigh-Love VTI inversion

on:
  push:
    branches:
      - feature/bfgs-rayleigh-love-vti
  pull_request:
    paths:
      - BFGS_joint_VTI.py
      - tests/test_joint_vti.py
      - .github/workflows/test-joint-vti.yml

jobs:
  numerical-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy scipy disba matplotlib
      - name: Run regression and synthetic recovery tests
        run: python -m unittest discover -s tests -p 'test_joint_vti.py' -v
      - name: Run the standalone synthetic inversion demo
        run: python BFGS_joint_VTI.py --demo --output-dir test_demo_vti --maxiter 70 --scan-points 60 --no-plot
      - name: Inspect demo fit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("test_demo_vti/summary.json").read_text())
          print(json.dumps(d, indent=2))
          assert d["rayleigh_rmse_km_s"] < 0.03, d
          assert d["love_rmse_km_s"] < 0.03, d
          PY
